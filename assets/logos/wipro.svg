<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60" fill="none">
  <!-- Wipro Logo -->
  <g transform="translate(10, 8)">
    <!-- 4 colored dots swirl -->
    <circle cx="20" cy="14" r="5" fill="#E81123"/>
    <circle cx="28" cy="22" r="5" fill="#F7630C"/>
    <circle cx="24" cy="32" r="5" fill="#FFB900"/>
    <circle cx="14" cy="34" r="5" fill="#00B294"/>
    <circle cx="6"  cy="26" r="5" fill="#0078D7"/>
    <circle cx="10" cy="16" r="5" fill="#881798"/>
    <!-- Central sphere -->
    <circle cx="18" cy="23" r="3.5" fill="#002D62"/>
    <!-- Text -->
    <text x="46" y="30" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#002D62" letter-spacing="1">wipro</text>
  </g>
</svg>
